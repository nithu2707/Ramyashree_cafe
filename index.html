<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title> Ramyashree Cafe</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        header {
            background-color:white;
            color: rgba(206, 62, 10, 0.765);
            padding: 1px;
            text-align: center;
        }
        h1{
            margin: 4px;
        }
        h2{
            margin: 3px;
        }

        nav {
            background-color: rgb(249, 213, 213);
            padding: 10px;
        }

        nav a {
            color: black;
            text-decoration: none;
            margin-right: 15px;
        }

        .content {
            display: flex;
            min-height: 400px;
        }

        aside {
            width: 220px;
            background-color:white;
            padding: 20px;
            box-sizing: border-box;
        }

        aside iframe {
            width: 100%;
            height: 50px;
            background-origin: padding-box;
        }

        main {
            flex: 1;
            padding: 30px;
            background-color: beige;
            box-sizing: border-box;
        }

        main iframe {
            width: 100%;
            height: 400px;
            border: none;
        }

        footer {
            background-color: black;
            color: white;
            padding: 20px;
            text-align: center;
        }

    </style>

</head>


<body>

    <header>

        <h1>My Training Website</h1>
        <h2>Ramyashree Cafe</h2>

    </header>


    <!-- NAV -->

    <nav>
    <b>
    <a href="home.html" target="sideContent">Home</a>
    <a href="menu.html" target="sideContent">Menu</a>
    <a href="about.html" target="sideContent">About Us</a>
    <a href="order.html" target="sideContent">Order Now</a>
    <a href="login.html" target="sideContent">Login</a>
    <a href="contact.html" target="sideContent">Contact Us</a>
    </b>
    </nav>


    <div class="content">


        <!-- ASIDE -->

        <aside>

            <iframe src="login.html" name="sideContent">Login
            </iframe>
            <iframe src="contact.html" name="sideContent">Contact Us
            </iframe>
            <iframe src="about.html" name="sideContent">About
            </iframe>
        

        </aside>


        <!-- MAIN -->

        <main>

            <iframe
                src="welcome.html"
                name="courseContent">
            </iframe>

        </main>


    </div>


    <footer>

        Copyright © 2026

    </footer>


</body>

</html>
